name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
      - 'backup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14' # keep in step with the Dockerfile base image

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app entrypoint.py tests
          ruff format --check app entrypoint.py tests

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

  # The uses: ./ jobs pull the image pinned in action.yml; only this job runs
  # this commit's Dockerfile and app/.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Build the image
        run: docker build -t commit-info-extractor:ci .

      - name: Run the image against this repository
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          docker run --rm \
            -v "$PWD:/github/workspace" -w /github/workspace \
            -v "$RUNNER_TEMP/files:/github/files" \
            -e GITHUB_ENV=/github/files/env \
            -e GITHUB_OUTPUT=/github/files/output \
            -e INPUT_COMMIT_LIMIT=5 \
            -e INPUT_EXTRACT_PATTERN='(feat|fix|docs|chore|ci|test|refactor):' \
            -e INPUT_OUTPUT_FORMAT=json \
            commit-info-extractor:ci
          grep -x 'key_variable=ENVIRONMENT' "$RUNNER_TEMP/files/output"
          grep '^match_count=' "$RUNNER_TEMP/files/output"

      - name: Reject a blocked extract_command
        run: |
          ! docker run --rm \
            -v "$PWD:/github/workspace" -w /github/workspace \
            -e INPUT_COMMIT_LIMIT=5 \
            -e INPUT_EXTRACT_COMMAND='grep foo; id' \
            commit-info-extractor:ci

  test-basic-extraction:
    name: Test Basic Extraction
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Test default extraction
        id: extract-default
        uses: ./
        with:
          commit_limit: '5'

      - name: Verify output
        run: |
          cat <<'EOF'
          key_variable=${{ steps.extract-default.outputs.key_variable }}
          value_variable=${{ steps.extract-default.outputs.value_variable }}
          EOF
          echo "PASS: basic extraction completed"

  test-pattern-extraction:
    name: Test Pattern Extraction
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Test with extract_pattern
        id: extract-pattern
        uses: ./
        with:
          commit_limit: '5'
          extract_pattern: '(feat|fix|docs|chore):'
          output_format: 'json'
          debug: 'true'

      - name: Verify pattern output
        run: |
          cat <<'EOF'
          match_count=${{ steps.extract-pattern.outputs.match_count }}
          EOF
          echo "PASS: pattern extraction completed"

  test-options:
    name: Test Options
    runs-on: ubuntu-latest
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pretty-format
            pretty: 'true'
            commit_limit: '3'
            output_format: 'text'
          - name: json-output
            pretty: 'false'
            commit_limit: '5'
            output_format: 'json'
          - name: csv-output
            pretty: 'false'
            commit_limit: '5'
            output_format: 'csv'
          - name: custom-key
            pretty: 'false'
            commit_limit: '3'
            output_format: 'text'
            key_variable: 'DEPLOY_ENV'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Test ${{ matrix.name }}
        id: extract
        uses: ./
        with:
          commit_limit: ${{ matrix.commit_limit }}
          pretty: ${{ matrix.pretty }}
          output_format: ${{ matrix.output_format }}
          key_variable: ${{ matrix.key_variable || 'ENVIRONMENT' }}

      - name: Verify output
        run: |
          cat <<'EOF'
          key=${{ steps.extract.outputs.key_variable }}
          value=${{ steps.extract.outputs.value_variable }}
          EOF
          echo "PASS: ${{ matrix.name }} completed"
