name: 'Extract Commit Action'
description:
  'Extracts information from commit messages. Defaults output variable name to
  "ENVIRONMENT" if not specified.'
author: 'somaz94'
inputs:
  commit_limit:
    description: 'Number of commits to retrieve.'
    required: true
  pretty:
    description: 'Whether to use pretty format for git log.'
    required: false
    default: 'false'
  key_variable:
    description:
      'The name of the key variable to set, defaults to "ENVIRONMENT".'
    required: false
    default: 'ENVIRONMENT'
  extract_command:
    description:
      'The command to use for extracting information from commit messages.'
    required: false
  extract_pattern:
    description:
      'Regex pattern to extract information from commit messages (safer alternative to extract_command). Cannot be used together with extract_command.'
    required: false
  commit_range:
    description:
      'Git commit range (e.g., "HEAD~5..HEAD", "v1.0.0..v1.1.0"). Takes priority over commit_limit when specified.'
    required: false
  fail_on_empty:
    description: 'Whether to fail the action if no environment information is extracted.'
    required: false
    default: 'false'
  output_format:
    description: 'Format of the output (json, csv, text). Defaults to text.'
    required: false
    default: 'text'
  debug:
    description: 'Enable debug mode for verbose output.'
    required: false
    default: 'false'
  timeout:
    description: 'Timeout in seconds for git and extract commands.'
    required: false
    default: '30'
outputs:
  key_variable:
    description: 'Extracted output key variable information.'
  value_variable:
    description: 'Extracted output value variable information.'
  match_count:
    description: 'Number of extracted matches.'
runs:
  using: 'docker'
  # A prebuilt image rather than `Dockerfile`. With `Dockerfile`, every consumer
  # workflow builds this image before the action can start — measured at 31s per
  # run. Pulling costs a few seconds.
  #
  # The Dockerfile is still the source this image is built from, and ci.yml
  # keeps building it on every pull request, so the build path cannot rot.
  #
  # Two things this trades away, both deliberate:
  #   1. The tag must not be pushed before the image exists. release.yml
  #      publishes the image in a job the release job depends on, and the very
  #      first version is seeded by hand via its workflow_dispatch.
  #   2. `Dockerfile` built for whatever architecture the runner was; a registry
  #      reference resolves only to what was pushed. The image is published
  #      linux/amd64 + linux/arm64 so arm64 runners keep working.
  image: docker://ghcr.io/somaz94/commit-info-extractor:v1.5.0
  env:
    INPUT_COMMIT_LIMIT: ${{ inputs.commit_limit }}
    INPUT_PRETTY: ${{ inputs.pretty }}
    INPUT_KEY_VARIABLE: ${{ inputs.key_variable }}
    INPUT_EXTRACT_COMMAND: ${{ inputs.extract_command }}
    INPUT_EXTRACT_PATTERN: ${{ inputs.extract_pattern }}
    INPUT_COMMIT_RANGE: ${{ inputs.commit_range }}
    INPUT_FAIL_ON_EMPTY: ${{ inputs.fail_on_empty }}
    INPUT_OUTPUT_FORMAT: ${{ inputs.output_format }}
    INPUT_DEBUG: ${{ inputs.debug }}
    INPUT_TIMEOUT: ${{ inputs.timeout }}
branding:
  icon: 'check-circle'
  color: 'yellow'
